[package]
name = "downflac"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
indicatif = "0.18.6"
inquire = "0.9.4"
lofty = "0.25.5"
reqwest = { version = "0.13.4", features = ["json", "socks", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
ureq = "3.5.0"
webpki-root-certs = "1.0.11"
